// Build for Minecraft 26.x, which ships without obfuscation and uses Mojang's own names.
// Needs Java 25 (run Gradle with JAVA_HOME pointing at a JDK 25).
plugins {
    id 'net.fabricmc.fabric-loom' version '1.19-SNAPSHOT'
}

def mcProps = new Properties()
file("versions/${project.mc}.properties").withInputStream { mcProps.load(it) }
def minecraftVersion = mcProps.minecraft_version

version = "${project.mod_version}+mc${project.mc}"
group = 'dev.modhider'
base { archivesName = 'modhider' }

loom {
    runConfigs.configureEach { runDir = "run/${project.mc}" }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraftVersion}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    // Only used in the dev environment for testing; the mod itself does not require Fabric API.
    localRuntime "net.fabricmc.fabric-api:fabric-api:${mcProps.fabric_version}"
}

processResources {
    def props = [version: project.version, minecraft_version: mcProps.mc_range]
    inputs.properties props
    filesMatching('fabric.mod.json') { expand props }
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }
